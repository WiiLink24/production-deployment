services:
################################################################################
#                             Shared dependencies                              #
################################################################################
  postgres:
    restart: unless-stopped
    image: postgres:14-alpine
    ports:
      - 127.0.0.1:${POSTGRES_PORT}:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - db_access

  nginx:
    restart: unless-stopped
    build: nginx/
    networks:
      - internal
    ports:
      - ${NGINX_HTTP_PORT}:80
      - ${NGINX_HTTPS_PORT}:443
    env_file:
      - .env
    volumes:
    - ${ROOM_ASSETS_PATH}:/var/www/room-assets
    - ./config/room-server/server.pem:/var/www/room-certs/server.pem
    - ./config/room-server/server.key:/var/www/room-certs/server.key
    - ${DIGICARD_PATH}:/var/www/digicard
    - ${FOOD_ASSETS_PATH}:/var/www/food-assets
    - ${NC_ASSETS_PATH}:/var/www/nc-assets
    - ${ANNOUNCEMENTS_PATH}:/var/www/announcements
    - ${CMOC_ASSETS_PATH}:/var/www/cmoc-assets
    - ${FORECAST_ASSETS_PATH}:/var/www/forecast
    - ${NEWS_ASSETS_PATH}:/var/www/news/v2
    - ${EVC_FILES_PATH}:/var/www/evc
    - ${DOMINOS_CERTS_PATH}:/var/www/dominos
    - ${PATCHER_FILES_PATH}:/var/www/patcher
    - ${CFH_FILES_PATH}:/var/www/cfh
    - ${KIRBY_XML_PATH}:/var/www/kirby/xml
    - ${KIRBY_EPISODES_PATH}:/var/www/kirby/episodes
    - ${KIRBY_PROMOS_PATH}:/var/www/kirby/promos

  redis:
    restart: unless-stopped
    image: redis:latest
    container_name: redis
    networks:
      - redis_access
    volumes:
      - redis_data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    command: redis-server --requirepass ${REDIS_PASSWORD}

  coredns:
    restart: unless-stopped
    image: coredns/coredns
    environment:
      - HOST_IP=${HOST_IP}
    ports:
      - "${HOST_IP}:${DNS_PORT}:53/udp"
      - "${HOST_IP}:${DNS_PORT}:53/tcp"
    volumes:
      - ./coredns/Corefile:/Corefile
      - ./coredns/address.d:/etc/coredns/address.d
      - ./coredns/server.d:/etc/coredns/server.d
  
  wireguard_client:
    restart: unless-stopped
    image: ghcr.io/wfg/wireguard:latest
    networks:
      - internal
      - db_access
    cap_add:
      - NET_ADMIN
    environment:
      - ALLOWED_SUBNETS=192.168.0.0/24,192.168.1.0/24,172.16.0.0/12
    volumes:
      - ./config/wireguard:/etc/wireguard

################################################################################
#                                  Wii Room                                    #
################################################################################
  room_server:
    restart: unless-stopped
    image: ghcr.io/wiilink24/room-server:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/room-server/config.py:/home/server/config.py
      - ./config/eula.txt:/home/server/conf/eula.txt
      - ${ROOM_ASSETS_PATH}:/home/server/assets

################################################################################
#                         Food Channel (Fake ordering)                         #
################################################################################
  food_server:
    restart: unless-stopped
    image: ghcr.io/wiilink24/food-server:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/food-server/config.py:/home/server/config.py
      - ./config/eula.txt:/home/server/conf/eula.txt
      - ${FOOD_ASSETS_PATH}:/home/server/images

################################################################################
#                           Food Channel (Just Eat)                            #
################################################################################
  just_eat:
    restart: unless-stopped
    image: ghcr.io/wiilink24/demae-justeat:latest
    depends_on:
      - nginx
      - postgres
      - redis
    networks:
      - internal
      - db_access
      - redis_access
    volumes:
      - ./config/eater/config.xml:/app/config.xml
      - /tmp:/tmp

################################################################################
#                           Food Channel (Domino's)                            #
################################################################################
  demae_dominos:
    restart: unless-stopped
    image: ghcr.io/wiilink24/demae-dominos
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - wireguard_client
      - postgres
    network_mode: service:wireguard_client
    volumes:
      - ./config/dominos/config.xml:/app/config.xml
      - ${DOMINOS_ASSETS_PATH}:/app/images
      - ${DOMINOS_ERRORS_PATH}:/app/errors
      - /tmp:/tmp

  tracker:
    restart: unless-stopped
    image: ghcr.io/wiilink24/demae-tracker
    depends_on:
      - nginx
      - wireguard_client
    network_mode: service:wireguard_client

################################################################################
#                            Photo Prints Channel                              #
################################################################################
  cam_server:
    restart: unless-stopped
    image: ghcr.io/wiilink24/cam-server:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/cam-server/config.py:/home/server/config.py
      - ${CAM_TEMPLATES_PATH}:/home/server/templates
      - ${CAM_TEMPLATES_PATH}/00000002.app:/home/server/00000002.app
      - ${CAM_ORDERS_PATH}:/home/server/orders

  digicard:
    restart: unless-stopped
    image: ghcr.io/wiilink24/digicard:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
      - cam_server
    networks:
      - internal
      - db_access
    volumes:
      - ./config/digicard/config.py:/home/server/config.py
      - ${CAM_ORDERS_PATH}:/home/server/orders
      - ${DIGICARD_PATH}:/home/server/cards

################################################################################
#                           Mii Contest Channel                                #
################################################################################
  cmoc_admin:
    restart: unless-stopped
    image: ghcr.io/wiilink24/miicontestchannelserver:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
      - redis
    networks:
      - internal
      - db_access
      - redis_access
    volumes:
      - ./config/cmoc-admin/config.xml:/opt/wiilink/cmoc/MiiContestChannelServer/config.xml
      - ${CMOC_ASSETS_PATH}:/opt/wiilink/cmoc/MiiContestChannelServer/cmoc-assets

  cmoc_viewer:
    restart: unless-stopped
    image: ghcr.io/wiilink24/miicontestchannelweb:latest
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    env_file:
      - ./config/cmoc-viewer/.env
  
  cmoc:
    restart: unless-stopped
    image: ghcr.io/wiilink24/miicontestchannel:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - db_access
    volumes:
      - ./config/cmoc/config.xml:/home/server/config.xml
      - ${CMOC_ASSETS_PATH}:/home/server/assets

################################################################################
#                                 Wii Mail                                     #
################################################################################
  wii_mail:
    restart: unless-stopped
    image: ghcr.io/wiilink24/mail-server:latest
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
      - monitoring_access
    volumes:
      - ./config/wii-mail/config.xml:/app/config.xml

  mail_admin:
    restart: unless-stopped
    image: ghcr.io/wiilink24/mail-admin:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
    networks:
      - internal
    volumes:
      - ./config/mail-admin/config.xml:/app/config.xml
      - ${ANNOUNCEMENTS_PATH}:/app/announcements

################################################################################
#                               News Channel                                   #
################################################################################
  news_channel:
    restart: unless-stopped
    image: ghcr.io/wiilink24/newschannel:latest
    network_mode: service:wireguard_client
    group_add:
      - ${GID}
    volumes:
      - ./config/news/config.xml:/home/server/config.xml
      - ./config/news/Private.pem:/home/server/Private.pem
      - ${NEWS_ASSETS_PATH}:/home/server/v2
      - ${NEWS_CACHE_PATH}:/home/server/cache
    depends_on:
      - nginx
      - wireguard_client
      - rsshub

  rsshub:
    restart: unless-stopped
    image: ghcr.io/diygod/rsshub:chromium-bundled
    network_mode: service:wireguard_client
    depends_on:
      - wireguard_client
    environment:
      NODE_ENV: production
      CACHE_TYPE:
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:1200/healthz']
      interval: 30s
      timeout: 10s
      retries: 3

################################################################################
#                               Forecast Channel                               #
################################################################################
  forecast_channel:
    restart: unless-stopped
    image: ghcr.io/wiilink24/forecastchannel:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
    volumes:
      - ./config/forecast/config.xml:/home/server/config.xml
      - ./config/forecast/Private.pem:/home/server/Private.pem
      - ${FORECAST_ASSETS_PATH}:/home/server/files

################################################################################
#                              WiiLink Accounts                                #
################################################################################
  account_manager:
    restart: unless-stopped
    image: ghcr.io/wiilink24/accountmanager:latest
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - internal
    volumes:
      - ./config/accounts/config.xml:/AccountManager/config.xml
      - /tmp:/tmp

################################################################################
#                            Mii Stamp Generator                               #
################################################################################
  stamp:
    restart: unless-stopped
    image: ghcr.io/wiilink24/stamp-generator:latest
    depends_on:
      - nginx
    networks:
      - internal

################################################################################
#                              Nintendo Channel                                #
################################################################################
  nintendo_channel:
    restart: unless-stopped
    image: ghcr.io/wiilink24/nintendochannelweb:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ${NC_ASSETS_PATH}:/home/server/assets
      - ./config/nc/config.xml:/home/server/config.xml
      - ./config/nc/config.py:/home/server/config.py

####################################################################################
#                           Everybody Votes Channel                                #
####################################################################################
  evc_web_panel:
    restart: unless-stopped
    image: ghcr.io/wiilink24/evcwebpanel:latest
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/evc-web-panel/config.py:/home/server/config.py

  votes_server:
    restart: unless-stopped
    image: ghcr.io/wiilink24/votes-server:latest
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/evc-server/config.xml:/opt/wiilink/evc/Votes-Server/config.xml

  evc_viewer:
    restart: unless-stopped
    image: ghcr.io/wiilink24/evc-viewer:latest
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    env_file:
      ./config/evc-viewer/.env
  
  evc:
    restart: unless-stopped
    image: ghcr.io/wiilink24/evc:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - db_access
    volumes:
      - ./config/evc/config.xml:/home/server/config.xml
      - ./config/evc/Private.pem:/home/server/Private.pem
      - ${EVC_FILES_PATH}/votes:/home/server/votes

####################################################################################
#                                     Discord Bot                                  #
####################################################################################
  wiilink_bot:
    restart: unless-stopped
    image: ghcr.io/wiilink24/wiilink-bot:latest
    group_add:
      - ${GID}
    depends_on:
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/bot/google_creds.json:/app/google_creds.json
      - ${BOT_WADS_PATH}:/app/wads
      - ./config/bot/.env:/app/.env

####################################################################################
#                                       Pipeline                                   #
####################################################################################
  pipeline:
    restart: unless-stopped
    image: ghcr.io/wiilink24/mobiclip-linux-setup:latest
    depends_on:
      - nginx
    networks:
      - internal
    volumes:
      - ./config/pipeline/config.py:/home/ubuntu/ui/config.py
      - ./config/pipeline/User.lic:/home/ubuntu/User.lic

####################################################################################
#                                     WFC Website                                  #
####################################################################################
  wfc_web:
    restart: unless-stopped
    image: ghcr.io/wiilink24/wfc-web:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
    networks:
      - internal
      - db_access
    volumes:
      - ./config/wfc-web/config.py:/home/server/config.py
      - ${WFC_PATCHES_PATH}:/home/server/patches

####################################################################################
#                                  Checkout Website                                #
####################################################################################
  checkout:
    restart: unless-stopped
    image: ghcr.io/wiilink24/checkout:latest
    group_add:
      - ${GID}
    depends_on:
      - nginx
      - postgres
    networks:
      - internal
      - db_access
    volumes:
      - ./config/checkout/config.py:/home/ubuntu/config.py
      - ./checkout-cache:/home/ubuntu/cache
      - ${CAM_ORDERS_PATH}:/home/ubuntu/uploads:ro
      - ${CAM_TEMPLATES_PATH}/templates:/home/ubuntu/templates/templates:ro
      - ${CAM_TEMPLATES_PATH}/fonts:/home/ubuntu/templates/fonts:ro

networks:
  internal:
  db_access:
  redis_access:
  monitoring_access:
    external: true

volumes:
  pgdata:
  redis_data:
