# DLS1: Download Server, provides files such as Pokémon Mystery Gifts, Super Smash Bros. Brawl configuration files, etc.
# Ran by Billy (@InternalLoss on GitHub) - https://services.billy.wales/
dls1.wiimmfi.de dls1.ilostmymind.xyz {
    template IN A {
        answer "{{ .Name }} 60 IN A 195.201.236.139"
    }
    template IN ANY {
        rcode NOERROR
    }
    log
    errors
}

